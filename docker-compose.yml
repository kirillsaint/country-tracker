services:
  api:
    build: ./backend
    restart: unless-stopped
    # Только localhost: наружу смотрит nginx, а не контейнер
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      MONGO_URL: mongodb://mongo:27017/country_counter
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-ge.kirillsaint.countrycounter}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      ORIZN_API_KEY: ${ORIZN_API_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo-data:
