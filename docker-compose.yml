services:
  api:
    build: ./backend
    restart: unless-stopped
    # Только localhost: наружу смотрит nginx, а не контейнер
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      MONGO_URL: mongodb://mongo:27017/country_counter
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-ge.kirillsaint.stamps}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://country-tracker.kirillsaint.ge}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-5.6-sol}
      OPENROUTER_FAST_MODEL: ${OPENROUTER_FAST_MODEL:-openai/gpt-5.6-luna}
      SELF_STORE_URL: ${SELF_STORE_URL:-}
      SELF_STORE_APP_ID: ${SELF_STORE_APP_ID:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ADMIN_GOOGLE_CLIENT_ID: ${ADMIN_GOOGLE_CLIENT_ID:-}
      ADMIN_GOOGLE_MAPS_KEY: ${ADMIN_GOOGLE_MAPS_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo-data:
