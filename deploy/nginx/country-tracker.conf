# /etc/nginx/sites-available/country-tracker.conf
#
# TLS терминирует Cloudflare (оранжевое облако на DNS-записи), до сервера трафик идёт по HTTP.
# В Cloudflare -> SSL/TLS -> Overview выберите режим "Flexible" (Cloudflare -> origin по HTTP).
# Если хотите шифровать и этот участок — режим "Full", выпустите Origin Certificate
# (SSL/TLS -> Origin Server) и добавьте server-блок на 443 с ним; API-часть не меняется.

server {
    listen 80;
    listen [::]:80;
    server_name country-tracker.kirillsaint.ge;

    # Реальный IP клиента приходит от Cloudflare в заголовке
    real_ip_header CF-Connecting-IP;
    include /etc/nginx/cloudflare-ips.conf;

    # Пачка точек — до 500 штук, укладывается с запасом
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
