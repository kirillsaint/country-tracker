# Xcode-проект генерируется из этого файла: `xcodegen generate` в папке ios/.
# Сам .xcodeproj в git не попадает.
name: CountryCounter
options:
  bundleIdPrefix: ge.kirillsaint
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

configFiles:
  # Team ID и Google client id — свои у каждого, поэтому лежат в гитигноренном файле.
  # Скопируйте Config.xcconfig.example -> Config.xcconfig и заполните.
  Debug: Config.xcconfig
  Release: Config.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"

targets:
  CountryCounter:
    type: application
    platform: iOS
    sources:
      - path: CountryCounter
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - target: CountryCounterWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ge.kirillsaint.stamps
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Какой файл entitlements брать — задаётся в Config.xcconfig (APP_ENTITLEMENTS):
        # Full — с Sign in with Apple (нужен платный аккаунт), Free — без него (Personal Team)
        CODE_SIGN_ENTITLEMENTS: $(APP_ENTITLEMENTS)
    info:
      path: CountryCounter/Info.plist
      properties:
        CFBundleDisplayName: Stamps
        # Языки приложения — по ним iOS показывает выбор языка в Настройках -> Stamps
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru]
        CFBundleShortVersionString: "0.2.2"
        CFBundleVersion: "7"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: Чтобы определять страну и город, где вы находитесь.
        NSLocationAlwaysAndWhenInUseUsageDescription: Чтобы считать дни по странам, приложению нужна геолокация и в фоне — иначе оно узнает о переезде только когда вы его откроете.
        UIBackgroundModes: [location, fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [ge.kirillsaint.stamps.refresh]
        # Google Sign-In: значения подставляются из Config.xcconfig на этапе сборки
        GIDClientID: $(GOOGLE_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]

  # Виджеты домашнего экрана и экрана блокировки. Данные получают из снимка в App Group.
  CountryCounterWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: CountryCounterWidgets
      # общий код с приложением: модели, локализация, снимок
      - path: CountryCounter/Shared
      - path: CountryCounter/Models.swift
      - path: CountryCounter/Localization.swift
      - path: CountryCounter/Localizable.xcstrings
    # XcodeGen генерирует этот файл заново при каждом запуске — содержимое задаём здесь
    entitlements:
      path: CountryCounterWidgets/CountryCounterWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          [group.ge.kirillsaint.stamps.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ge.kirillsaint.stamps.widget
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: CountryCounterWidgets/Info.plist
      properties:
        CFBundleDisplayName: Stamps
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru]
        # версия расширения обязана совпадать с версией приложения
        CFBundleShortVersionString: "0.2.2"
        CFBundleVersion: "7"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
